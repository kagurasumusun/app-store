name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep logs readable and avoid interactive prompts.
  CI: "true"
  GIT_TERMINAL_PROMPT: "0"

jobs:
  # ---------------------------------------------------------------------------
  # Portable protocol core. Runs everywhere and needs no Apple SDK.
  # ---------------------------------------------------------------------------
  core:
    name: Core (C++20, gcc + ASan/UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          set -euo pipefail
          c++ --version
          python3 --version
          openssl version

      - name: Build and run the portable test suite
        run: bash Scripts/build_core.sh

      - name: Run under AddressSanitizer + UndefinedBehaviorSanitizer
        env:
          SANITIZE: "1"
        run: bash Scripts/build_core.sh

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-artifacts
          path: |
            build/core-tests/fixtures
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Static analysis for the layers that need a compiler to be fully checked.
  # ---------------------------------------------------------------------------
  static:
    name: Static checks (Swift syntax, bridge API, pbxproj)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install analysis tools
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install pbxproj tree-sitter tree-sitter-swift

      - name: Run static checks
        run: bash Scripts/check_static.sh

      - name: Regenerate the Xcode project and verify it is committed
        run: |
          set -euo pipefail
          python3 Scripts/generate_xcodeproj.py
          if ! git diff --quiet -- IpaStore.xcodeproj; then
            echo "::error::IpaStore.xcodeproj is stale. Run Scripts/generate_xcodeproj.py."
            git diff --stat -- IpaStore.xcodeproj
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Apple toolchain: the only place where Swift, Objective-C++ and SwiftUI are
  # actually compiled.
  # ---------------------------------------------------------------------------
  apple:
    name: Xcode 27 build (iOS 27 SDK, device .ipa)
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Show the runner
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          ls /Applications | grep -E '^Xcode' || true

      - name: Select the newest Xcode 27.1+ toolchain
        id: xcode
        run: |
          set -euo pipefail
          candidate=""
          for path in /Applications/Xcode_27.2*.app /Applications/Xcode_27.1*.app /Applications/Xcode_27*.app; do
            if [ -d "$path" ]; then candidate="$path"; break; fi
          done
          if [ -z "$candidate" ]; then
            echo "::error::No Xcode 27 image found on this runner."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Using $candidate"
          sudo xcode-select -s "$candidate"
          echo "xcode_path=$candidate" >> "$GITHUB_OUTPUT"

      - name: Versions
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          xcodebuild -project IpaStore.xcodeproj -list

      - name: Verify the deployment target is iOS 27
        run: |
          set -euo pipefail
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 27.0;' IpaStore.xcodeproj/project.pbxproj
          grep -q 'SWIFT_OBJC_BRIDGING_HEADER = IpaStore/IpaStore-Bridging-Header.h;' \
            IpaStore.xcodeproj/project.pbxproj
          echo "deployment target and bridging header are set"

      # Apple clang is stricter than the Linux compiler in a few places, and
      # libc++ differs from libstdc++. Re-run the portable suite with it.
      - name: Portable core with Apple clang and libc++
        env:
          CC: clang
          CXX: clang++
          # Defer the openssl assertions to a later step so a certificate
          # formatting difference cannot hide compiler errors.
          SKIP_OPENSSL_CHECKS: "1"
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set -o pipefail
          bash Scripts/build_core.sh 2>&1 | tee build/logs/core-clang.log

      - name: Build for the iOS Simulator (Swift + Objective-C++)
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            bash Scripts/build_app.sh --simulator 2>&1 | tee build/logs/simulator.log | xcbeautify
          else
            bash Scripts/build_app.sh --simulator 2>&1 | tee build/logs/simulator.log
          fi

      # The deliverable is the arm64 device app. CI has no signing identity, so
      # the binary is unsigned; --sign with DEVELOPMENT_TEAM produces an
      # installable build locally.
      - name: Build the device app (arm64, Release)
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set -o pipefail
          if command -v xcbeautify >/dev/null 2>&1; then
            bash Scripts/build_app.sh --device --configuration Release \
              2>&1 | tee build/logs/device.log | xcbeautify
          else
            bash Scripts/build_app.sh --device --configuration Release \
              2>&1 | tee build/logs/device.log
          fi

      - name: Package the IPA
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set -o pipefail
          bash Scripts/package_ipa.sh 2>&1 | tee build/logs/ipa.log

      # Uploaded before the remaining checks so the artifact survives a later
      # failure, and with if-no-files-found: error so a missing IPA fails the
      # job instead of silently producing no artifact.
      # CI has no signing identity, so this IPA is unsigned and will NOT
      # install on a real device. Sign locally with --sign and DEVELOPMENT_TEAM.
      - name: Upload the device IPA (unsigned)
        uses: actions/upload-artifact@v7
        with:
          name: IpaStore-ipa
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build Release for the simulator
        run: |
          set -euo pipefail
          set -o pipefail
          bash Scripts/build_app.sh --simulator --configuration Release \
            2>&1 | tee build/logs/simulator-release.log

      - name: Check the built bundle
        run: |
          set -euo pipefail
          app_path=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -name 'IpaStore.app' -maxdepth 1 | head -n1)
          echo "bundle: $app_path"
          test -d "$app_path"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app_path/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app_path/Info.plist"
          # The Swift and Objective-C++ objects must both be in the binary.
          nm -gU "$app_path/IpaStore" | grep -q 'IPInstallServer' && echo "Objective-C++ symbols linked"
          lipo -info "$app_path/IpaStore"

      - name: Validate generated certificates with openssl
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set -o pipefail
          bash Scripts/build_core.sh 2>&1 | tee build/logs/fixtures.log

      # The raw log is only reachable through the Actions log viewer, so emit
      # annotations for the diagnostics that can be read from the Checks API.
      - name: Annotate diagnostics
        if: failure()
        run: |
          set -euo pipefail
          python3 Scripts/ci_annotate.py build/logs/*.log || true

      - name: Collect build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcode-logs
          path: build/logs
          if-no-files-found: ignore
          retention-days: 14
